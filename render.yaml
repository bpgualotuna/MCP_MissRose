services:
  - type: web
    name: mrrose-mcp-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MCP_SERVER_HOST
        value: 0.0.0.0
      - key: MCP_SERVER_PORT
        value: 10000
